<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" style="background:#0E0F12">
  <!-- Simulated voronoi cells -->
  <polygon points="0,0 180,0 160,110 40,120" fill="#16171C" stroke="#2A2B30" stroke-width="0.75"/>
  <polygon points="180,0 400,0 400,80 230,60 180,0" fill="#16171C" stroke="#2A2B30" stroke-width="0.75"/>
  <polygon points="0,0 40,120 0,200" fill="#16171C" stroke="#2A2B30" stroke-width="0.75"/>
  <polygon points="40,120 160,110 140,220 30,240 0,200" fill="#16171C" stroke="#2A2B30" stroke-width="0.75"/>
  <polygon points="160,110 230,60 400,80 380,200 200,210 140,220" fill="#16171C" stroke="#2A2B30" stroke-width="0.75"/>
  <polygon points="0,200 30,240 0,300" fill="#16171C" stroke="#2A2B30" stroke-width="0.75"/>
  <polygon points="30,240 140,220 160,300 0,300" fill="#16171C" stroke="#2A2B30" stroke-width="0.75"/>
  <polygon points="140,220 200,210 380,200 400,300 160,300" fill="#16171C" stroke="#2A2B30" stroke-width="0.75"/>
  <polygon points="230,60 400,80 400,0" fill="#16171C" stroke="#2A2B30" stroke-width="0.75"/>
  <!-- Color accent fills for regions -->
  <polygon points="0,0 180,0 160,110 40,120" fill="#D89A4E" fill-opacity="0.15"/>
  <polygon points="140,220 200,210 380,200 400,300 160,300" fill="#60a5fa" fill-opacity="0.1"/>
  <polygon points="160,110 230,60 400,80 380,200 200,210 140,220" fill="#4ade80" fill-opacity="0.08"/>
</svg>
